name: Seasonal feature validation

on:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/seasonal-validation.yml'
  push:
    branches:
      - feature/adaptive-performance-and-retention

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
