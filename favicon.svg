<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Round Corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Four Holiday Spirits in Circle (Top: Xmas Tree, Right: Valentine Heart, Bottom: Tet Blossom, Left: Halloween Pumpkin) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Central Festive Sparkle Star -->
  <path d="M32 14 L34 26 L46 28 L36 34 L38 46 L32 38 L26 46 L28 34 L18 28 L30 26 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- 4 Seasonal Accent Jewels -->
  <!-- Top: Christmas Green -->
  <circle cx="32" cy="8" r="4.5" fill="#22c55e" stroke="#fff" stroke-width="1.5" />
  <!-- Right: Valentine Rose Pink -->
  <circle cx="56" cy="32" r="4.5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" />
  <!-- Bottom: Tet Golden Yellow -->
  <circle cx="32" cy="56" r="4.5" fill="#eab308" stroke="#fff" stroke-width="1.5" />
  <!-- Left: Halloween Pumpkin Orange -->
  <circle cx="8" cy="32" r="4.5" fill="#f97316" stroke="#fff" stroke-width="1.5" />
</svg>
